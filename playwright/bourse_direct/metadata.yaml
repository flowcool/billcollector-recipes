  forced on incremental runs.
- Only operation notices for one PEA account; PEA-PME has synthetic coverage only. Annual statements and tax documents
  are outside this recipe.
- Synthetic exact-engine qualification only for this changed recipe. Earlier real-source proof covered October 2026
