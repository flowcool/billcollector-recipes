services:
- serviceName: free
  steps:
  - step: 1
    description: Open the public login page.
    methods:
    - method: goto
      arguments:
      - url: https://subscribe.free.fr/login/
  - step: 2
    description: Enter the Freebox subscriber identifier.
    methods:
    - method: locator
      arguments:
      - selector: '#login_b'
    - method: fill
      arguments:
      - value: '{{USERNAME}}'
  - step: 3
    description: Enter the Freebox subscriber password.
    methods:
    - method: locator
      arguments:
      - selector: '#pass_b'
    - method: fill
      arguments:
      - value: '{{PASSWORD}}'
  - step: 4
    description: Submit the Freebox login form.
    methods:
    - method: locator
      arguments:
      - selector: '#ok'
    - method: click
      arguments:
      - timeout: 30000
  - step: 5
    description: Open the complete Freebox invoice history.
    methods:
    - method: locator
      arguments:
      - selector: xpath=//a[contains(@href, 'facture_liste.pl') and @title='Voir toutes mes factures']
    - method: click
      arguments:
      - timeout: 30000
  - step: 6
    description: Expand every invoice year without closing the other years.
    methods:
    - method: evaluate
      arguments:
      - expression: () => document.querySelectorAll('div.listblock.accordion.closed').forEach(e => e.classList.replace('closed','open'))
  - step: 7
    description: Download every PDF invoice in the Freebox history.
    methods:
    - method: locator
      arguments:
      - selector: xpath=//a[contains(@href, 'facture_pdf.pl') and contains(@class, 'btn_download') and
          @title='Télécharger votre facture en PDF']
    - method: download_all
      arguments:
      - key_attribute: href
        max_items: 200
        timeout_ms: 600000
        event_window_ms: 10000
