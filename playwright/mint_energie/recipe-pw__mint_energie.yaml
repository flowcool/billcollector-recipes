services:
- serviceName: mint_energie
  steps:
  - step: 1
    description: Open the public login page.
    methods:
    - method: goto
      arguments:
      - url: https://client.mint-energie.com/Pages/Connexion/connexion.aspx
  - step: 2
    description: Complete login and consent, or confirm the existing session.
    methods:
    - method: wait_user
      arguments:
      - prompt: Complete login and consent in the browser. Select the intended account.
          Resume only when the account page is ready.
        until:
          selector: a[href*='factures_liste.aspx']
  - step: 3
    description: Open the Mint Energie invoice list.
    methods:
    - method: goto
      arguments:
      - url: https://client.mint-energie.com/Pages/Compte/factures_liste.aspx
  - step: 4
    description: Download only the first listed document. Order is not verified.
    methods:
    - method: expect_download
    steps:
    - step: 1
      methods:
      - method: locator
        arguments:
        - selector: xpath=//a[normalize-space()='Afficher le PDF' and contains(@href,
            '.pdf')]
      - method: first
      - method: click
        arguments:
        - timeout: 60000
