services:
- serviceName: mint_energie
  steps:
  - description: Open the public account page.
    methods:
    - method: goto
      arguments:
      - url: https://client.mint-energie.com/Pages/Connexion/connexion.aspx
    step: 1
  - step: 2
    description: Use the current session or sign in once.
    methods:
    - method: login
      arguments:
      - success:
          selector: '#header1_LB_Exit1'
        max_failures: 1
        timeout_ms: 30000
        session_timeout_ms: 3000
    steps:
    - description: Enter the account credential.
      methods:
      - method: locator
        arguments:
        - selector: '#TB_Login'
      - method: fill
        arguments:
        - value: '{{USERNAME}}'
      step: 2
    - description: Enter the account credential.
      methods:
      - method: locator
        arguments:
        - selector: '#TB_Password'
      - method: fill
        arguments:
        - value: '{{PASSWORD}}'
      step: 3
    submit:
      description: Submit account login.
      methods:
      - method: locator
        arguments:
        - selector: '#BT_Connexion'
      - method: click
        arguments:
        - timeout: 30000
      step: 4
  - description: Open the public account page.
    methods:
    - method: goto
      arguments:
      - url: https://client.mint-energie.com/Pages/Compte/factures_liste.aspx
    step: 3
  - description: Download all filtered invoices in PDF format.
    methods:
    - method: locator
      arguments:
      - selector: '#BT_Download'
    - method: download_all
      arguments:
      - key_attribute: id
        max_items: 200
        timeout_ms: 600000
        event_window_ms: 10000
    step: 4
