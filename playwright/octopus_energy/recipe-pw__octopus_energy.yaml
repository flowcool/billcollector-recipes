services:
- serviceName: octopus_energy
  steps:
  - step: 1
    description: Open the public login page.
    methods:
    - method: goto
      arguments:
      - url: https://octopusenergy.fr/connexion
  - description: Reject optional cookies.
    graceful: true
    methods:
    - method: locator
      arguments:
      - selector: text=Continuer sans accepter
    - method: click
      arguments:
      - timeout: 3000
    step: 2
  - description: Enter the account credential.
    methods:
    - method: locator
      arguments:
      - selector: '[data-testid="login-email-field"]'
    - method: fill
      arguments:
      - value: '{{USERNAME}}'
    step: 3
  - description: Enter the account credential.
    methods:
    - method: locator
      arguments:
      - selector: '[data-testid="password-field"]'
    - method: fill
      arguments:
      - value: '{{PASSWORD}}'
    step: 4
  - description: Submit account login.
    methods:
    - method: locator
      arguments:
      - selector: '[data-testid="loginButton"]'
    - method: click
      arguments:
      - timeout: 30000
    step: 5
  - step: 6
    description: Open the Octopus Energy bills and payments page.
    methods:
    - method: locator
      arguments:
      - selector: xpath=//a[contains(@href, '/factures-et-paiements') and not(@data-part)]
    - method: click
      arguments:
      - timeout: 30000
  - step: 7
    description: Open the Octopus Energy agreement billing page.
    methods:
    - method: locator
      arguments:
      - selector: xpath=//a[contains(@href, '/factures-et-paiements/')]
    - method: click
      arguments:
      - timeout: 30000
  - description: Refuse an account without issued invoices.
    methods:
    - method: evaluate
      arguments:
      - expression: () => { if ([...document.querySelectorAll('td')].some(e => e.textContent.trim() ===
          'Aucune facture')) throw new Error('No issued invoices are available for qualification'); throw
          new Error('Invoice download controls require qualification before use'); }
    step: 8
