services:
- serviceName: octopus_energy
  steps:
  - step: 1
    description: Open the public login page.
    methods:
    - method: goto
      arguments:
      - url: https://octopusenergy.fr/connexion
  - step: 2
    description: Complete login and consent, or confirm the existing session.
    methods:
    - method: wait_user
      arguments:
      - prompt: Complete login and consent in the browser. Select the intended account.
          Resume only when the account page is ready.
        until:
          selector: xpath=//a[contains(@href, '/factures-et-paiements') and not(@data-part)]
  - step: 3
    description: Open the Octopus Energy bills and payments page.
    methods:
    - method: locator
      arguments:
      - selector: xpath=//a[contains(@href, '/factures-et-paiements') and not(@data-part)]
    - method: click
      arguments:
      - timeout: 30000
  - step: 4
    description: Open the Octopus Energy agreement billing page.
    methods:
    - method: locator
      arguments:
      - selector: xpath=//a[contains(@href, '/factures-et-paiements/')]
    - method: click
      arguments:
      - timeout: 30000
  - step: 5
    description: Download the payment schedule.
    methods:
    - method: expect_download
    steps:
    - step: 1
      methods:
      - method: locator
        arguments:
        - selector: xpath=//button[normalize-space()='Mon échéancier de paiement']
      - method: click
        arguments:
        - timeout: 60000
